<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" width="960" height="280">
  <defs>
    <!-- Background Micro-Grid Pattern -->
    <pattern id="grid-arch" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="0.8" fill="#38BDF8" fill-opacity="0.06"/>
    </pattern>

    <!-- Radial Cyan Accent Glow -->
    <radialGradient id="glow-arch" cx="85%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0.22"/>
      <stop offset="50%" stop-color="#0284C7" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#060B14" stop-opacity="0"/>
    </radialGradient>

    <!-- Canvas Linear Gradient -->
    <linearGradient id="bg-arch" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1322"/>
      <stop offset="50%" stop-color="#070E1A"/>
      <stop offset="100%" stop-color="#050A12"/>
    </linearGradient>

    <!-- Block Card Gradient -->
    <linearGradient id="card-arch" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1E34" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#081424" stop-opacity="0.98"/>
    </linearGradient>

    <filter id="glow-cyan-arch" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- 1. Canvas Base & Grid -->
  <rect width="960" height="280" rx="12" fill="url(#bg-arch)"/>
  <rect width="960" height="280" rx="12" fill="url(#grid-arch)"/>
  <rect width="960" height="280" rx="12" fill="url(#glow-arch)"/>
  <rect x="0.75" y="0.75" width="958.5" height="278.5" rx="11.25" fill="none" stroke="#162844" stroke-width="1.5"/>
  <line x1="48" y1="1" x2="320" y2="1" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" filter="url(#glow-cyan-arch)"/>

  <!-- 2. Header Architecture Banner Info -->
  <g transform="translate(48, 28)">
    <rect x="0" y="0" width="270" height="20" rx="10" fill="#08203E" stroke="#0284C7" stroke-width="1"/>
    <circle cx="10" cy="10" r="3" fill="#38BDF8"/>
    <text x="20" y="14" fill="#7DD3FC" font-family="'Inter', sans-serif" font-size="9" font-weight="700" letter-spacing="0.8">SYSTEM ARCHITECTURE PIPELINE</text>

    <text x="0" y="44" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="20" font-weight="800" letter-spacing="-0.3">MODULAR HEALTHCARE &amp; MEDICAL TOURISM MONOLITH</text>
    <text x="0" y="60" fill="#BAE6FD" font-family="'Inter', sans-serif" font-size="11.5" font-weight="500">
      Clean Architecture Separation • Reactive UI • Domain Isolation • Spatie RBAC Audit Guard
    </text>
  </g>

  <!-- 3. Pipeline Interconnect Data Connectors -->
  <g stroke="#0284C7" stroke-width="2" stroke-dasharray="4 4" fill="none" opacity="0.6">
    <line x1="248" y1="175" x2="270" y2="175"/>
    <line x1="478" y1="175" x2="500" y2="175"/>
    <line x1="708" y1="175" x2="730" y2="175"/>
  </g>
  <!-- Arrow Heads -->
  <polygon points="272,175 266,171 266,179" fill="#38BDF8"/>
  <polygon points="502,175 496,171 496,179" fill="#38BDF8"/>
  <polygon points="732,175 726,171 726,179" fill="#38BDF8"/>

  <!-- 4. Architecture Stage 01: Presentation Layer -->
  <g transform="translate(48, 105)">
    <rect width="200" height="145" rx="10" fill="url(#card-arch)" stroke="#162E50" stroke-width="1.5"/>
    <rect x="0" y="0" width="200" height="28" rx="10" fill="#0E2342"/>
    <text x="14" y="18" fill="#38BDF8" font-family="'SF Mono', monospace" font-size="10" font-weight="700">01. PRESENTATION</text>
    
    <text x="14" y="48" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="12" font-weight="700">Blade &amp; Livewire 3</text>
    <text x="14" y="68" fill="#BAE6FD" font-family="'Inter', sans-serif" font-size="10">• Reactive Tourism Maps</text>
    <text x="14" y="86" fill="#BAE6FD" font-family="'Inter', sans-serif" font-size="10">• 24/7 Emergency Radius</text>
    <text x="14" y="104" fill="#BAE6FD" font-family="'Inter', sans-serif" font-size="10">• Cost Filter &amp; Estimator</text>
    <text x="14" y="122" fill="#BAE6FD" font-family="'Inter', sans-serif" font-size="10">• Tailwind CSS Responsive</text>
  </g>

  <!-- 5. Architecture Stage 02: Modular Domain Core -->
  <g transform="translate(278, 105)">
    <rect width="200" height="145" rx="10" fill="url(#card-arch)" stroke="#162E50" stroke-width="1.5"/>
    <rect x="0" y="0" width="200" height="28" rx="10" fill="#0E2342"/>
    <text x="14" y="18" fill="#38BDF8" font-family="'SF Mono', monospace" font-size="10" font-weight="700">02. DOMAIN MODULES</text>
    
    <text x="14" y="48" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="12" font-weight="700">nwidart/laravel-modules</text>
    <text x="14" y="68" fill="#BAE6FD" font-family="'Inter', sans-serif" font-size="10">• MedicalCare Specialists</text>
    <text x="14" y="86" fill="#BAE6FD" font-family="'Inter', sans-serif" font-size="10">• MedicalPoints (Geo)</text>
    <text x="14" y="104" fill="#BAE6FD" font-family="'Inter', sans-serif" font-size="10">• MedicalCenters (RS Hub)</text>
    <text x="14" y="122" fill="#BAE6FD" font-family="'Inter', sans-serif" font-size="10">• Jamu &amp; Javanese Wellness</text>
  </g>

  <!-- 6. Architecture Stage 03: Security & Audit Layer -->
  <g transform="translate(508, 105)">
    <rect width="200" height="145" rx="10" fill="url(#card-arch)" stroke="#162E50" stroke-width="1.5"/>
    <rect x="0" y="0" width="200" height="28" rx="10" fill="#0E2342"/>
    <text x="14" y="18" fill="#38BDF8" font-family="'SF Mono', monospace" font-size="10" font-weight="700">03. SECURITY &amp; AUDIT</text>
    
    <text x="14" y="48" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="12" font-weight="700">Spatie RBAC Guard</text>
    <text x="14" y="68" fill="#BAE6FD" font-family="'Inter', sans-serif" font-size="10">• 5-Tier Role Boundaries</text>
    <text x="14" y="86" fill="#BAE6FD" font-family="'Inter', sans-serif" font-size="10">• Sqids ID Obfuscation</text>
    <text x="14" y="104" fill="#BAE6FD" font-family="'Inter', sans-serif" font-size="10">• Immutable Activity Logs</text>
    <text x="14" y="122" fill="#BAE6FD" font-family="'Inter', sans-serif" font-size="10">• Anti-Enumeration URLs</text>
  </g>

  <!-- 7. Architecture Stage 04: Persistence & Data Layer -->
  <g transform="translate(738, 105)">
    <rect width="174" height="145" rx="10" fill="url(#card-arch)" stroke="#162E50" stroke-width="1.5"/>
    <rect x="0" y="0" width="174" height="28" rx="10" fill="#0E2342"/>
    <text x="14" y="18" fill="#38BDF8" font-family="'SF Mono', monospace" font-size="10" font-weight="700">04. PERSISTENCE</text>
    
    <text x="14" y="48" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="12" font-weight="700">MySQL 8.0 &amp; Cache</text>
    <text x="14" y="68" fill="#BAE6FD" font-family="'Inter', sans-serif" font-size="10">• Facility Geocoding</text>
    <text x="14" y="86" fill="#BAE6FD" font-family="'Inter', sans-serif" font-size="10">• ACID Transactions</text>
    <text x="14" y="104" fill="#BAE6FD" font-family="'Inter', sans-serif" font-size="10">• Zero Telemetry Egress</text>
    <text x="14" y="122" fill="#BAE6FD" font-family="'Inter', sans-serif" font-size="10">• Backup Schedules</text>
  </g>
</svg>
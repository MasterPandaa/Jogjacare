<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" width="960" height="280">
  <defs>
    <!-- Background Micro-Grid Pattern -->
    <pattern id="grid-jogjacare" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="0.8" fill="#38BDF8" fill-opacity="0.07"/>
    </pattern>

    <!-- Ambient Radial Halo: Medical Sky Blue / Cyan -->
    <radialGradient id="halo-jogjacare" cx="138" cy="140" r="170" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0.32"/>
      <stop offset="50%" stop-color="#0284C7" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#060B14" stop-opacity="0"/>
    </radialGradient>

    <!-- Canvas Linear Gradient: Deep Medical Navy -->
    <linearGradient id="bg-grad-jogjacare" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1322"/>
      <stop offset="50%" stop-color="#070E1A"/>
      <stop offset="100%" stop-color="#050A12"/>
    </linearGradient>

    <!-- Brand Card Shading -->
    <linearGradient id="card-grad-jogjacare" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2038" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0A1526" stop-opacity="0.98"/>
    </linearGradient>

    <!-- Glow Filter for Medical Accents -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 1. Background Layers -->
  <rect width="960" height="280" rx="12" fill="url(#bg-grad-jogjacare)"/>
  <rect width="960" height="280" rx="12" fill="url(#grid-jogjacare)"/>
  <rect width="960" height="280" rx="12" fill="url(#halo-jogjacare)"/>

  <!-- 2. Architectural Outer Border & Top Medical Cyan Accent Line -->
  <rect x="0.75" y="0.75" width="958.5" height="278.5" rx="11.25" fill="none" stroke="#162844" stroke-width="1.5"/>
  <line x1="48" y1="1" x2="280" y2="1" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" filter="url(#glow-cyan)"/>

  <!-- 3. Left Brand Showcase Card (180x180 px) -->
  <g transform="translate(48, 50)">
    <!-- Card Frame Base -->
    <rect width="180" height="180" rx="18" fill="url(#card-grad-jogjacare)" stroke="#1A365D" stroke-width="1.5"/>
    <!-- Inner Border Glow -->
    <rect x="1.5" y="1.5" width="177" height="177" rx="16.5" fill="none" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.35"/>
    <!-- Precision Corner Alignment Brackets -->
    <path d="M 12 24 L 12 12 L 24 12" fill="none" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
    <path d="M 168 156 L 168 168 L 156 168" fill="none" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>

    <!-- Brand Emblem: Healthcare Cross + Geometric Heart + Wellness Rings (White & Light Blue) -->
    <g transform="translate(90, 90)">
      <!-- Outer Orbit Ring -->
      <circle cx="0" cy="0" r="52" fill="none" stroke="#0284C7" stroke-width="1.5" stroke-dasharray="5 4" opacity="0.6"/>
      <!-- Inner Glow Circle -->
      <circle cx="0" cy="0" r="42" fill="#0284C7" fill-opacity="0.15" stroke="#38BDF8" stroke-width="1.5"/>
      
      <!-- Medical Cross Primitives (Clean White & Light Blue) -->
      <path d="M -10 -26 L 10 -26 L 10 -10 L 26 -10 L 26 10 L 10 10 L 10 26 L -10 26 L -10 10 L -26 10 L -26 -10 L -10 -10 Z" fill="#0284C7" stroke="#38BDF8" stroke-width="2" stroke-linejoin="round"/>
      <!-- Inner Cross Highlight -->
      <path d="M -6 -20 L 6 -20 L 6 -6 L 20 -6 L 20 6 L 6 6 L 6 20 L -6 20 L -6 6 L -20 6 L -20 -6 L -6 -6 Z" fill="#FFFFFF"/>

      <!-- Heart Telemetry Overlay in Center -->
      <circle cx="0" cy="0" r="4" fill="#38BDF8"/>
    </g>
  </g>

  <!-- 4. Typography & Title Section -->
  <g transform="translate(254, 52)">
    <!-- Category Pill Badge -->
    <rect x="0" y="0" width="285" height="22" rx="11" fill="#08203E" stroke="#0284C7" stroke-width="1"/>
    <circle cx="11" cy="11" r="3.5" fill="#38BDF8" filter="url(#glow-cyan)"/>
    <text x="22" y="15" fill="#7DD3FC" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="700" letter-spacing="0.8">MEDICAL TOURISM &amp; HEALTHCARE DIY</text>

    <!-- Main Title -->
    <text x="0" y="60" fill="#FFFFFF" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5">JOGJACARE</text>

    <!-- Tagline (White and Light Blue) -->
    <text x="0" y="88" fill="#BAE6FD" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="13.5" font-weight="500">
      Digital Gateway for Healthcare Services &amp; Medical Tourism in Yogyakarta
    </text>

    <!-- Technical Badges Matrix -->
    <g transform="translate(0, 110)">
      <rect width="82" height="24" rx="4" fill="#0D1D34" stroke="#1E3A5F" stroke-width="1"/>
      <text x="41" y="16" fill="#E0F2FE" font-family="'SF Mono', Consolas, monospace" font-size="10.5" font-weight="600" text-anchor="middle">Laravel 11</text>
    </g>

    <g transform="translate(90, 110)">
      <rect width="80" height="24" rx="4" fill="#0D1D34" stroke="#1E3A5F" stroke-width="1"/>
      <text x="40" y="16" fill="#E0F2FE" font-family="'SF Mono', Consolas, monospace" font-size="10.5" font-weight="600" text-anchor="middle">Livewire 3</text>
    </g>

    <g transform="translate(178, 110)">
      <rect width="60" height="24" rx="4" fill="#0D1D34" stroke="#1E3A5F" stroke-width="1"/>
      <text x="30" y="16" fill="#E0F2FE" font-family="'SF Mono', Consolas, monospace" font-size="10.5" font-weight="600" text-anchor="middle">MySQL</text>
    </g>

    <g transform="translate(246, 110)">
      <rect width="112" height="24" rx="4" fill="#0D1D34" stroke="#1E3A5F" stroke-width="1"/>
      <text x="56" y="16" fill="#E0F2FE" font-family="'SF Mono', Consolas, monospace" font-size="10.5" font-weight="600" text-anchor="middle">Modular Monolith</text>
    </g>

    <g transform="translate(366, 110)">
      <rect width="102" height="24" rx="4" fill="#0D1D34" stroke="#1E3A5F" stroke-width="1"/>
      <text x="51" y="16" fill="#E0F2FE" font-family="'SF Mono', Consolas, monospace" font-size="10.5" font-weight="600" text-anchor="middle">Spatie RBAC</text>
    </g>

    <!-- Repository Ownership & Status -->
    <g transform="translate(0, 158)">
      <!-- GitHub Icon -->
      <path d="M 8 0 C 3.58 0 0 3.58 0 8 C 0 11.54 2.29 14.53 5.47 15.59 C 5.87 15.66 6.02 15.42 6.02 15.21 C 6.02 15.02 6.01 14.39 6.01 13.72 C 4 14.09 3.48 13.23 3.32 12.78 C 3.23 12.55 2.84 11.84 2.5 11.65 C 2.22 11.5 1.82 11.13 2.49 11.12 C 3.12 11.11 3.57 11.7 3.72 11.94 C 4.44 13.15 5.59 12.81 6.05 12.6 C 6.12 12.08 6.33 11.73 6.56 11.53 C 4.78 11.33 2.92 10.64 2.92 7.58 C 2.92 6.71 3.23 5.99 3.74 5.43 C 3.66 5.23 3.38 4.41 3.82 3.31 C 3.82 3.31 4.49 3.1 6.02 4.13 C 6.66 3.95 7.34 3.86 8.02 3.86 C 8.7 3.86 9.38 3.95 10.02 4.13 C 11.55 3.09 12.22 3.31 12.22 3.31 C 12.66 4.41 12.38 5.23 12.3 5.43 C 12.81 5.99 13.12 6.7 13.12 7.58 C 13.12 10.65 11.25 11.33 9.47 11.53 C 9.76 11.78 10.01 12.26 10.01 13.01 C 10.01 14.08 10 14.94 10 15.21 C 10 15.42 10.15 15.67 10.55 15.59 C 13.71 14.53 16 11.53 16 8 C 16 3.58 12.42 0 8 0 Z" fill="#64748B"/>
      <text x="24" y="12.5" fill="#94A3B8" font-family="'SF Mono', Consolas, monospace" font-size="12" font-weight="500">MasterPandaa / Jogjacare</text>
      
      <!-- Status Badge -->
      <rect x="235" y="-1" width="92" height="18" rx="3" fill="#081D35" stroke="#0284C7" stroke-width="1"/>
      <circle cx="243" cy="8" r="2.5" fill="#38BDF8"/>
      <text x="250" y="11.5" fill="#BAE6FD" font-family="'SF Mono', Consolas, monospace" font-size="9" font-weight="700">PUBLIC OPEN</text>
    </g>
  </g>

  <!-- 5. Right Graphic Showcase: Medical Tourism & Geo Proximity Monitor -->
  <g transform="translate(740, 45)">
    <!-- Monitor Outer Frame Base -->
    <rect x="0" y="0" width="172" height="190" rx="14" fill="#09172B" stroke="#162E50" stroke-width="1.5"/>
    <rect x="1.5" y="1.5" width="169" height="187" rx="12.5" fill="none" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.25"/>

    <!-- Header Bar -->
    <rect x="0" y="0" width="172" height="28" rx="14" fill="#0E2342"/>
    <circle cx="14" cy="14" r="3" fill="#38BDF8"/>
    <text x="24" y="17" fill="#E0F2FE" font-family="'Inter', sans-serif" font-size="9.5" font-weight="700" letter-spacing="0.5">YOGYAKARTA DIY</text>

    <!-- Geo-Pin + Healthcare Signal Icon -->
    <g transform="translate(86, 74)">
      <!-- Pulse Rings -->
      <circle cx="0" cy="0" r="28" fill="none" stroke="#0284C7" stroke-width="1" opacity="0.5"/>
      <circle cx="0" cy="0" r="20" fill="#0284C7" fill-opacity="0.15" stroke="#38BDF8" stroke-width="1.5"/>

      <!-- Map Pin Location Vector -->
      <path d="M 0 -16 C -7 -16 -12 -11 -12 -4 C -12 5 0 16 0 16 C 0 16 12 5 12 -4 C 12 -11 7 -16 0 -16 Z" fill="#0284C7" stroke="#38BDF8" stroke-width="1.5"/>
      <!-- Medical Cross inside Pin -->
      <path d="M -2 -7 L 2 -7 L 2 -4 L 5 -4 L 5 -2 L 2 -2 L 2 1 L -2 1 L -2 -2 L -5 -2 L -5 -4 L -2 -4 Z" fill="#FFFFFF"/>
    </g>

    <!-- Vital Pulse / Tourism Connection Line -->
    <path d="M 14 125 L 45 125 L 53 115 L 61 138 L 71 95 L 81 145 L 89 120 L 97 127 L 105 125 L 158 125" fill="none" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow-cyan)"/>

    <!-- Tourism Healthcare Proximity Badge -->
    <rect x="12" y="145" width="148" height="30" rx="6" fill="#061324" stroke="#1E3A5F" stroke-width="1"/>
    <text x="86" y="157" fill="#BAE6FD" font-family="'Inter', sans-serif" font-size="8.5" font-weight="600" text-anchor="middle">ATTRACTION ⇄ HEALTH</text>
    <text x="86" y="169" fill="#38BDF8" font-family="'SF Mono', monospace" font-size="8.5" font-weight="700" text-anchor="middle">24/7 EMERGENCY READY</text>
  </g>
</svg>